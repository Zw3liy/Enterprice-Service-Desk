# Fail2Ban filter for Nginx Proxy Manager authentication failures.
#
# NPM's access log format can vary with version and custom templates —
# ALWAYS validate before enabling the npm-auth jail:
#
#   fail2ban-regex /path/to/npm/access.log /etc/fail2ban/filter.d/npm-auth.conf
#
# The first regex assumes NPM's combined-style log (client IP first).
# The second covers NPM audit-log style entries ("login attempt failed").
# The third covers generic 401/403 bursts on the admin/API surface.

[Definition]

failregex = ^<HOST> .*"(GET|POST) /(api/tokens|api/users|admin) .*" (401|403) .*
            ^<HOST> .*"POST /api/tokens HTTP/.*" (400|401) .*
            .*login attempt failed.*(from|ip[=: ]+)<HOST>.*

ignoreregex = ^<HOST> .*"(GET|POST) /api/.*" 200 .*
