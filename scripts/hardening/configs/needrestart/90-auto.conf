# -------------------------------------------------------------------
# needrestart — auto-restart services after library/kernel upgrades
# (no interactive "which services should be restarted?" prompt on a
# headless host). Installed by scripts/hardening/harden_updates.sh to
#   /etc/needrestart/conf.d/90-auto.conf
# -------------------------------------------------------------------

# 'a' = automatically restart services that need it after unattended
# upgrades. Use 'i' instead if you prefer interactive confirmation.
$nrconf{restart} = 'a';
