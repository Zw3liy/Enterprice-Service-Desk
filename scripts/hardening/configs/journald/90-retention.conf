# -------------------------------------------------------------------
# systemd-journald — bounded log retention.
# Installed by scripts/hardening/harden_updates.sh to
#   /etc/systemd/journald.conf.d/90-retention.conf
#
# Unbounded journald is both a disk-fill DoS and an unbounded forensic
# liability. 250 MB / 2 weeks is plenty for local triage; ship what
# matters OFF this host (see SERVER_HARDENING.md §3.7).
# -------------------------------------------------------------------

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=250M
SystemMaxFileSize=25M
MaxRetentionSec=2week
# Uncomment only if a separate syslog daemon collects these logs:
#ForwardToSyslog=yes
