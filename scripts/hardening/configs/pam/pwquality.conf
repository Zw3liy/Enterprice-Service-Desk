# -------------------------------------------------------------------
# PAM password quality policy.
# Installed by scripts/hardening/harden_login.sh to
#   /etc/security/pwquality.conf  (distro default is backed up first)
#
# Applies to NEW passwords set through PAM (passwd, useradd, Django
# flows that shell out). Enforces at every class + length:
# at least 14 chars with upper+lower+digit/symbol diversity, no long
# repeats, dictionary-checked, similar-to-username checked.
# -------------------------------------------------------------------

minlen = 14
minclass = 3
dcredit = -1
ucredit = -1
lcredit = -1
ocredit = -1
maxrepeat = 3
maxclassrepeat = 4
usercheck = 1
dictcheck = 1
# 1 = reject bad passwords for normal users (root may override).
# 2 = enforce for root as well (can lock you out of recovery — know
#     your console/physical access story before setting 2).
enforcing = 1
