# -------------------------------------------------------------------
# PAM account lockout policy (pam_faillock).
# Installed by scripts/hardening/harden_login.sh to
#   /etc/security/faillock.conf
#
# NOTE: this file configures pam_faillock but does NOT activate it.
# Activation = PAM stack change, done deliberately by a human:
#     sudo pam-auth-update
# and enable the "Restrict failed login attempts" (pam-faillock)
# profile. Test key login in a SECOND session before logging out.
# -------------------------------------------------------------------

# Lock the account after 5 failed attempts within the window.
deny = 5
fail_interval = 900

# Keep it locked for 15 minutes, then allow another try.
unlock_time = 900

# Record failures for auditing.
audit

# Apply to root as well (console access is the recovery path).
even_deny_root
root_unlock_time = 900
