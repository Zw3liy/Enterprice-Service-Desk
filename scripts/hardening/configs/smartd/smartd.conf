# -------------------------------------------------------------------
# smartd — automatic S.M.A.R.T. disk monitoring with early warnings.
# Installed by scripts/hardening/harden_monitoring.sh to
#   /etc/smartd.conf  (distro default is backed up first)
#
# -a           : all SMART attributes
# -o on -S on  : auto-save attribute history + track offline tests
# -n standby,q : don't spin up idle disks, but report if they fail
# -W 4,45,55   : warn on 4°C change, >45°C, >55°C
# -m root      : mail warnings to root (needs a local MTA)
# -M exec ...  : run the distro runner script on events
#
# To test the alert path once (sends a test email):
#   smartd -q onecheck -M test   (after installing and restarting smartd)
# -------------------------------------------------------------------

DEVICESCAN -a -o on -S on -n standby,q -W 4,45,55 -m root -M exec /usr/share/smartmontools/smartd-runner

# Pin individual disks instead of scanning, if preferred:
#/dev/sda -a -o on -S on -n standby,q -W 4,45,55 -m root -M exec /usr/share/smartmontools/smartd-runner
