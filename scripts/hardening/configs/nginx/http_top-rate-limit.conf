# -------------------------------------------------------------------
# Rate limiting — zone definitions.
#
# These MUST live in the http {} context (nginx forbids zone
# definitions in server blocks): merge into NPM's
# /data/nginx/custom/http_top.conf, or include from http {} on native
# nginx. Then activate per host with the matching lines from
# server-advanced/rate-limit.conf in NPM's "Advanced" tab.
#
# Tuning note: with Cloudflare in front, $binary_remote_addr is the
# real client IP once http_top-real-ip-cloudflare.conf is in place —
# without it, every visitor shares one bucket (Cloudflare's edge IP)
# and limits will fire on legitimate traffic.
# -------------------------------------------------------------------

# Login/auth: 5 attempts per minute per IP, small burst for typing.
limit_req_zone  $binary_remote_addr zone=esd_auth:10m    rate=5r/m;

# General site traffic: 30 req/s per IP, generous bursts.
limit_req_zone  $binary_remote_addr zone=esd_general:10m rate=30r/s;

# Concurrent connections per IP (slowloris / connection floods).
limit_conn_zone $binary_remote_addr zone=esd_conn:10m;

limit_req_status 429;
limit_conn_status 429;
