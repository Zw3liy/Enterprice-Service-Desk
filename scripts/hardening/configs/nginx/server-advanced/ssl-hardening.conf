# -------------------------------------------------------------------
# TLS hardening — server-context snippet.
#
# NPM usage: paste into the "Advanced" tab of each HTTPS proxy host
# (together with security-headers.conf). Server-level values override
# whatever NPM generates for these directives.
# Native nginx: include from each TLS server {}.
#
# Profile: TLS 1.2+1.3 only, AEAD ciphers, no session tickets,
# OCSP stapling on. Test after applying: https://ssl-config.mozilla.org
# or `nmap --script ssl-enum-ciphers -p 443 <host>` (should be A/A+).
# -------------------------------------------------------------------

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling. Requires a resolver in the server/http context — NPM
# ships one (conf.d/include/resolvers.conf). If nginx -t passes but
# error.log shows OCSP resolver complaints, comment these two lines.
ssl_stapling on;
ssl_stapling_verify on;
