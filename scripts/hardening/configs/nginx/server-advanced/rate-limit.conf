# -------------------------------------------------------------------
# Rate limiting — server-context activation.
#
# Companion to http_top-rate-limit.conf (zones must already exist).
# NPM usage: paste into the "Advanced" tab of each proxy host.
# Native nginx: include from each server {}.
# -------------------------------------------------------------------

# Baseline: per-IP request + connection caps for the whole host.
limit_req  zone=esd_general burst=60 nodelay;
limit_conn esd_conn 30;

# Hard-cap the login surface. NPM lets you override a location by
# adding it in Advanced — Django's login lives at /accounts/login/.
# Uncomment and adjust the proxy_pass target to your upstream
# (use NPM's variable form so the existing proxy settings apply):
#location = /accounts/login/ {
#    limit_req zone=esd_auth burst=5 nodelay;
#    proxy_pass $forward_scheme://$server:$port;
#}
#location /api/ {
#    limit_req zone=esd_auth burst=10 nodelay;
#    proxy_pass $forward_scheme://$server:$port;
#}

# The 429 page: don't leak stack info (NPM serves its own error pages;
# this just guarantees a short body for API clients).
error_page 429 = @too_many_requests;
location @too_many_requests {
    return 429 '{"error":"too_many_requests"}';
    add_header Content-Type application/json always;
}
