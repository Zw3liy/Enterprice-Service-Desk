# -------------------------------------------------------------------
# Security response headers — server-context snippet.
#
# NPM usage: paste into the "Advanced" tab of each proxy host (the
# Advanced content is emitted inside the generated server {} block).
# Native nginx: include from each server {}.
#
# nginx inheritance gotcha: if a location block later defines its own
# add_header, ALL add_header directives from this server level stop
# applying inside that location. NPM's generated proxy locations don't
# add headers by default, so this is fine — but keep it in mind when
# adding custom locations.
#
# HSTS is intentionally NOT here: it is enabled per the ramp plan in
# docs/operations/PRODUCTION_DEPLOYMENT.md (the Django app already
# emits it when configured). Never enable HSTS from two layers at once
# with different values.
# -------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Admin/status hosts should never be indexed (put this in every admin
# proxy host; delete the line for the public customer portal):
add_header X-Robots-Tag "noindex, nofollow" always;

# Content-Security-Policy is application-specific — start report-only,
# review the reports for a week, then enforce:
#add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /csp-report" always;
