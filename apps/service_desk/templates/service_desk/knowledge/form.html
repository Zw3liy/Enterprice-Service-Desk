{% extends "layouts/base.html" %}

{% block content %}
<section class="panel" style="max-width:900px">
  <div class="panel-header"><h2>{{ title }}</h2></div>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Save article</button>
  </form>
</section>
{% endblock %}
