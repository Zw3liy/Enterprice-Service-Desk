# Copy to .github/workflows/ when the GitHub App has `workflows` permission.
name: Build container

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t enterprise-service-desk:ci .
      - name: Compose config
        run: docker compose -f docker-compose.yml config
