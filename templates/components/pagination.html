{% if page.paginator.num_pages > 1 %}
<nav aria-label="Pagination" class="mt-3">
  <ul class="pagination pagination-sm">
    {% if page.has_previous %}
    <li class="page-item"><a class="page-link" href="?page={{ page.previous_page_number }}&{{ request.GET.urlencode }}">Prev</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page.number }} / {{ page.paginator.num_pages }}</span></li>
    {% if page.has_next %}
    <li class="page-item"><a class="page-link" href="?page={{ page.next_page_number }}&{{ request.GET.urlencode }}">Next</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
