{% extends "base.html" %}


{% block content %}

<div class="dashboard-card">

<h2>
Search
</h2>


<form method="get">

<input 
type="text"
name="q"
value="{{ query }}"
placeholder="Search..."
>


<button class="btn btn-primary">

Search

</button>


</form>



{% if results %}

<h3>
Results
</h3>


{% for item in results %}

<p>
{{ item }}
</p>

{% endfor %}


{% else %}

<p>
No results found.
</p>

{% endif %}



</div>

{% endblock %}
