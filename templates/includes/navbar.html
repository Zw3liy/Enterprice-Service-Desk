<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3" aria-label="Account navigation">

    <a class="navbar-brand" href="{% url 'service_desk:dashboard' %}">
        Enterprise Service Desk
    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#esd-navbar"
            aria-controls="esd-navbar"
            aria-expanded="false"
            aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="esd-navbar">

        <div class="ms-auto d-flex flex-column flex-lg-row align-items-lg-center gap-2 py-2 py-lg-0">

            {% if user.is_authenticated %}

                <a class="btn btn-outline-light btn-sm position-relative"
                   href="{% url 'service_desk:notification_list' %}">
                    <i class="fa-solid fa-bell" aria-hidden="true"></i>
                    <span class="visually-hidden">Notifications</span>
                    {% if nav_unread_notifications %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            {{ nav_unread_notifications }}
                            <span class="visually-hidden">unread notifications</span>
                        </span>
                    {% endif %}
                </a>

                <span class="text-white small">{{ user.get_username }}</span>

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
                </form>

            {% else %}

                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>

            {% endif %}

        </div>

    </div>

</nav>
