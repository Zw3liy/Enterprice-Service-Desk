{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3>
                        Enterprise Service Desk
                    </h3>

                    <p class="mb-0">
                        User Authentication
                    </p>

                </div>


                <div class="card-body">


                    {% if form.errors %}

                    <div class="alert alert-danger">

                        Invalid username or password.

                    </div>

                    {% endif %}



                    <form method="post">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label for="id_username" class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                autofocus
                                required
                                id="id_username"
                                class="form-control"
                            >

                        </div>



                        <div class="mb-3">

                            <label for="id_password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                required
                                id="id_password"
                                class="form-control"
                            >

                        </div>



                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


{% endblock %}
