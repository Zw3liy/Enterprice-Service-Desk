{% extends "layouts/base.html" %}
{% block content %}
<section class="panel" style="max-width:720px">
  <div class="panel-header"><h2>Create problem</h2></div>
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label">Title</label><input class="form-control" name="title" required></div>
    <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="5"></textarea></div>
    <button class="btn btn-primary" type="submit">Create</button>
  </form>
</section>
{% endblock %}
