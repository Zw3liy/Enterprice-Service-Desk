{% load static %}

<nav class="navbar">

    <div class="navbar-left">

        <button class="menu-toggle" id="menuToggle" type="button">
            ☰
        </button>

        <div class="brand">
            <a href="/">
                <span class="brand-logo">🛠</span>
                <span class="brand-text">
                    Enterprise Service Desk
                </span>
            </a>
        </div>

    </div>

    <div class="navbar-center">

        <form class="search-form" method="get" action="">
            <input
                type="search"
                name="q"
                placeholder="Search tickets, users, assets..."
                autocomplete="off"
            >
        </form>

    </div>

    <div class="navbar-right">

        <button class="icon-button" title="Notifications">
            🔔
            <span class="badge">3</span>
        </button>

        <button class="icon-button" title="Messages">
            💬
        </button>

        <button class="icon-button" id="themeToggle" title="Toggle Theme">
            🌙
        </button>

        <div class="user-menu">

            <div class="avatar">
                {{ request.user.username|default:"Admin"|slice:":1"|upper }}
            </div>

            <div class="user-info">
                <strong>
                    {{ request.user.get_full_name|default:request.user.username|default:"Administrator" }}
                </strong>

                <small>
                    System Administrator
                </small>
            </div>

        </div>

    </div>

</nav>
