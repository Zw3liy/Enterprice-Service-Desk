{% extends "layouts/base.html" %}
{% block content %}
<section class="panel" style="max-width:720px">
  <div class="panel-header"><h2>Submit a request</h2></div>
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label">Service</label>
      <select name="request_type" class="form-select">
        <option value="">General request</option>
        {% for c in catalog %}<option value="{{ c.pk }}">{{ c.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3"><label class="form-label">Title</label><input class="form-control" name="title" required></div>
    <div class="mb-3"><label class="form-label">Details</label><textarea class="form-control" name="description" rows="5"></textarea></div>
    <button class="btn btn-primary" type="submit">Submit</button>
  </form>
</section>
{% endblock %}
