{% extends "layouts/base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-header"><h2>Help center</h2></div>
  <form method="get" class="mb-3 d-flex gap-2">
    <input class="form-control" name="q" value="{{ q }}" placeholder="Search help…">
    <button class="btn btn-outline-primary" type="submit">Search</button>
  </form>
  <div class="list-group">
    {% for a in page %}
    <a class="list-group-item list-group-item-action" href="{% url 'service_desk:knowledge_detail' a.slug %}">
      <strong>{{ a.title }}</strong>
      <div class="small text-muted">{{ a.summary|default:a.body|truncatechars:140 }}</div>
    </a>
    {% empty %}<div class="p-4 text-muted text-center">No articles found.</div>{% endfor %}
  </div>
  {% include "components/pagination.html" with page=page %}
</section>
{% endblock %}
