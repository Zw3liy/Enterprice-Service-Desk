name: Security Scan

on:
  push:
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Django
        run: pip install "Django==5.2.16"

      # Django's built-in --deploy check flags exactly what SEC-01
      # hardened: SECRET_KEY, DEBUG, ALLOWED_HOSTS, cookie/SSL settings.
      # Zero new dependencies. Most --deploy checks are WARNING level
      # (e.g. DEBUG=True is the expected default in this CI run, since
      # DJANGO_DEBUG is not set here), so this reports findings without
      # failing the build on expected dev-mode warnings - only a genuine
      # ERROR/CRITICAL level check fails the step.
      - name: Django deployment security check
        run: python manage.py check --deploy

      # No requirements.txt / pyproject.toml / Pipfile exists in this
      # repository (verified during CI-01 inspection), so there is no
      # dependency source to run a vulnerability audit against.
      # Documenting this limitation rather than inventing a manifest or
      # adding an unrelated scanner package/tool.
